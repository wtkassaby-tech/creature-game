name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools with Rokit
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Install Wally packages
        run: wally install

      - name: Quality gate
        run: lune run check
